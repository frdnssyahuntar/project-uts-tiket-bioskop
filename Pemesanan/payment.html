<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - TIX Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bar">
        <h1>Pembayaran</h1>
    </div>

    <div class="container">
        <div class="card" style="text-align: center;">
            <p class="movie-subtitle" style="margin-bottom: 8px;">Total Tagihan</p>
            <h2 id="payment-total" style="color: var(--primary-navy); font-size: 28px;">Rp 0</h2>
        </div>

        <div class="card">
            <h3 class="section-title">Informasi Kontak</h3>
            <div class="form-group">
                <input type="text" id="buyer-name" placeholder="Nama Lengkap" required>
            </div>
            <div class="form-group">
                <input type="email" id="buyer-email" placeholder="Email untuk E-Tiket" required>
            </div>
        </div>

        <div class="card">
            <h3 class="section-title">Metode Pembayaran</h3>
            <div class="payment-methods">
                <label class="method-card">
                    <input type="radio" name="payment" value="qris" checked>
                    <span class="method-name">DANA / QRIS</span>
                </label>
                <label class="method-card">
                    <input type="radio" name="payment" value="transfer">
                    <span class="method-name">Virtual Account BCA</span>
                </label>
                <label class="method-card">
                    <input type="radio" name="payment" value="credit">
                    <span class="method-name">Kartu Kredit / Debit</span>
                </label>
            </div>
        </div>

        <button id="btn-pay" class="btn full-width">Bayar Sekarang</button>
        <a href="summary.html" class="link-back">Kembali ke Ringkasan</a>
    </div>

    <script src="payment.js"></script>
</body>
</html>
