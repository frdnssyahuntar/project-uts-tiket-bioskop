<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metode Pembayaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bar">
        <a href="summary.html" style="font-size: 18px;">&times;</a>
        <h1>Metode Pembayaran</h1>
    </div>

    <div class="container">
        <div class="category-title">REKOMENDASI</div>
        <div class="payment-list" style="background-color: var(--card-bg);">
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg" alt="DANA">
                    <span>DANA</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <span style="font-weight: 700; color: #4CAF50; font-style: italic;">indodana</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
        </div>

        <div class="divider-thick"></div>

        <div class="category-title">E-WALLET</div>
        <div class="payment-list" style="background-color: var(--card-bg);">
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <span style="background-color: #EE4D2D; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px;">S Pay</span>
                    <span>ShopeePay/SPayLater</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <span style="color: #00AED6; font-weight: bold; font-size: 16px;">gopay</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <span style="color: #4C3494; font-weight: bold; font-size: 16px; font-style: italic;">OVO</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
        </div>

        <div class="divider-thick"></div>

        <div class="category-title">QRIS & LAINNYA</div>
        <div class="payment-list" style="background-color: var(--card-bg);">
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg" alt="QRIS">
                    <span>QRIS</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
            <div class="payment-item" onclick="window.location.href='summary.html'">
                <div class="payment-info">
                    <span style="color: #00C2FF; font-weight: bold; font-size: 18px;">blu</span>
                    <span>blu by BCA Digital</span>
                </div>
                <span class="arrow-right">&gt;</span>
            </div>
        </div>
    </div>
</body>
</html>
