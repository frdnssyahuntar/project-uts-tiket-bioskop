<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Kursi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bar">
        <a href="#">&lt;</a>
        <h1>Pilih Kursi</h1>
    </div>

    <div class="container" style="padding-bottom: 80px;">
        <div class="legend" style="margin-top: 20px;">
            <div class="legend-item"><div class="legend-box box-avail"></div> Tersedia</div>
            <div class="legend-item"><div class="legend-box box-select"></div> Dipilih</div>
            <div class="legend-item"><div class="legend-box box-occ"></div> Terisi</div>
        </div>

        <div class="cinema-wrapper">
            <div class="seat-grid" id="seat-grid"></div>

            <div class="screen-container">
                <div class="screen">LAYAR BIOSKOP</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="bottom-price" style="align-items: center;">
            <div>
                <span id="total-price">Rp 0</span>
                <div style="font-size: 11px; margin-top: 4px; color: var(--text-main);">
                    Kursi: <span id="seat-numbers" style="font-size: 12px; font-weight: 500;">-</span>
                </div>
            </div>
            <button id="btn-next" class="btn-pay" style="width: auto; padding: 10px 24px; border-radius: 6px;" disabled>RINGKASAN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
