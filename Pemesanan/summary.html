<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringkasan Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bar">
        <a href="seats.html">&lt;</a>
        <h1>Ringkasan Order</h1>
    </div>

    <div class="container">
        <div class="timer-banner" id="timer-banner">
            Selesaikan pembayaran Anda dalam <span id="timer">07 : 00</span>
        </div>

        <div class="section-title">Detail Transaksi</div>
        <div class="detail-box">
            <div class="detail-row bold-row">
                <span><span id="ticket-count">0</span> TIKET</span>
                <span id="seat-list">-</span>
            </div>
            <div class="detail-row">
                <span>KURSI</span>
                <span id="ticket-calc">Rp0 x 0</span>
            </div>
            <div class="detail-row">
                <span>
                    BIAYA LAYANAN
                    <small>Untuk membantu peningkatan pelayanan kami</small>
                </span>
                <span id="service-calc">Rp4.000 x 0</span>
            </div>
        </div>

        <div class="divider-thick"></div>

        <div class="section-title">Metode Pembayaran</div>
        <div class="payment-list">
            <label class="payment-item">
                <div class="payment-info">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg" alt="QRIS">
                    <span>QRIS</span>
                </div>
                <input type="radio" name="payment" value="qris" checked>
            </label>
            <label class="payment-item">
                <div class="payment-info">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg" alt="DANA">
                    <span>DANA</span>
                </div>
                <input type="radio" name="payment" value="dana">
            </label>

            <a href="payment_methods.html" class="link-more">Pilih pembayaran lainnya &gt;</a>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="bottom-price">
            TOTAL BAYAR
            <span id="grand-total">Rp0</span>
        </div>
        <button id="btn-pay" class="btn-pay">SELESAIKAN PEMBAYARAN ANDA</button>
    </div>

    <script src="summary.js"></script>
</body>
</html>
